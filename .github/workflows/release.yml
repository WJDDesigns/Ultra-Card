name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Needed to dispatch announce-release.yml when this workflow creates the release
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same gates as local `npm run release:check` and CI (typecheck, lint, tests, translations, build)
      - name: Release checks and production build
        run: npm run release:check

      - name: Verify build files
        run: |
          echo "Checking dist directory..."
          ls -la dist/
          echo "Checking main files..."
          ls -la ultra-card.js* hacs.json README.md license

      - name: Copy chunk files to root for HACS serving
        run: |
          echo "Copying lazy-load chunk files to root..."
          # Chunk names are content-hashed; drop anything stale so the release
          # asset glob (uc-*.js) only ships chunks referenced by this build.
          rm -f uc-*.js uc-*.js.LICENSE.txt
          cp dist/uc-*.js . 2>/dev/null || true
          cp dist/uc-*.js.LICENSE.txt . 2>/dev/null || true
          cp dist/ultra-card-panel.js . 2>/dev/null || true
          cp dist/ultra-card-panel.js.LICENSE.txt . 2>/dev/null || true
          echo "Root JS files after copy:"
          ls -la *.js | head -20
          echo "Total uc-* chunk files: $(ls uc-*.js 2>/dev/null | wc -l)"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION="${{ github.ref_name }}"
          # Remove 'v' prefix from version for matching
          VERSION_NUM="${VERSION#v}"

          echo "Looking for release notes for version: $VERSION_NUM"

          # Try to extract release notes from RELEASE_NOTES.md
          if [ -f "RELEASE_NOTES.md" ]; then
            echo "Found RELEASE_NOTES.md, extracting notes for version $VERSION_NUM..."
            
            # Extract the section for this version from RELEASE_NOTES.md
            # Look for "## Version $VERSION_NUM" and extract until the next "## Version" or end of file
            RELEASE_NOTES=$(awk -v version="$VERSION_NUM" '
              BEGIN { found=0; printing=0 }
              /^## Version/ {
                if ($3 == version) {
                  found=1
                  printing=1
                  next
                } else if (found && printing) {
                  exit
                }
              }
              printing && found { print }
            ' RELEASE_NOTES.md)
            
            if [ -n "$RELEASE_NOTES" ]; then
              echo "Successfully extracted release notes from RELEASE_NOTES.md"
              echo "$RELEASE_NOTES" > release_notes.md
            else
              echo "Version $VERSION_NUM not found in RELEASE_NOTES.md, using fallback"
              cat > release_notes.md << 'EOF'
          ## 🔗 Recent Updates

          Please check the [Release Notes](https://github.com/WJDDesigns/Ultra-Card/blob/main/RELEASE_NOTES.md) for detailed information about this release.

          ## 📝 Changes

          This release includes various improvements and bug fixes. See the full changelog in our repository.
          EOF
            fi
          else
            echo "RELEASE_NOTES.md not found, using default notes"
            cat > release_notes.md << 'EOF'
          ## 🔗 Recent Updates

          Please check the [Release Notes](https://github.com/WJDDesigns/Ultra-Card/blob/main/RELEASE_NOTES.md) for detailed information about this release.
          EOF
          fi

          echo "Generated release notes:"
          cat release_notes.md
          echo ""

          # Set the release notes as output
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # A release must never be visible to HACS without its assets. With
      # content_in_root=false HACS looks for ultra-card.js among the release
      # assets; when the release exists but the upload has not happened yet it
      # falls back to the repo root, where ultra-card.js is committed but the
      # uc-*.js chunks are gitignored. Users then get a new entry file with no
      # chunks: no editor, modules stuck loading, and a permanent "Ultra Card
      # was updated, reload" toast (3.10.0-beta8 and the first minutes of
      # beta9). So: create the release as a DRAFT, attach every asset, and only
      # then publish. HACS ignores drafts. `scripts/release.js` no longer
      # creates the release itself for the same reason.
      #
      # Record whether a release already existed (e.g. created by hand) so the
      # Discord announcement is only dispatched for releases this workflow
      # publishes; a hand-made publish already fired `release: published`.
      - name: Check if release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: What's New in ${{ steps.version.outputs.VERSION }}
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          fail_on_unmatched_files: true
          # Every asset listed here is downloaded flat into each user's
          # www/community/Ultra-Card/ by HACS (content_in_root=false ->
          # release mode). Ship only files the browser needs; no zip.
          files: |
            ultra-card.js
            ultra-card.js.LICENSE.txt
            ultra-card-panel.js
            ultra-card-panel.js.LICENSE.txt
            uc-*.js
            uc-*.js.LICENSE.txt

      # Belt and braces: refuse to publish unless the entry file and at least
      # one chunk are actually attached. A draft that fails here stays a draft
      # (invisible to HACS) and can be inspected on the Releases page.
      - name: Verify release assets before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          echo "$ASSETS"
          echo "$ASSETS" | grep -qx 'ultra-card.js' || { echo "::error::ultra-card.js is not attached to the release"; exit 1; }
          echo "$ASSETS" | grep -q '^uc-.*\.js$' || { echo "::error::no uc-*.js chunks attached to the release"; exit 1; }
          echo "Attached assets: $(echo "$ASSETS" | wc -l)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false

      # `announce-release.yml` is the single source of truth for the Discord
      # announcement. Publishing with GITHUB_TOKEN does not fire the
      # `release: published` event (GitHub suppresses events from GITHUB_TOKEN
      # to prevent workflow loops), so dispatch it manually. Skip when the
      # release pre-existed: that publish already announced itself.
      - name: Announce release to Discord
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run announce-release.yml --repo "${{ github.repository }}"
