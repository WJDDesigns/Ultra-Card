name: CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release checks and production build
        run: npm run release:check

      - name: Layout coverage gates
        run: npm run test:coverage -- src/editor/layout/

      - name: Bundle policy check
        # Multi-file ESM build: chunks must be content-hashed, the editor and
        # locales must be separate chunks, and the core entry must stay under
        # budget. See docs/bundle-strategy.md for the HACS distribution facts.
        run: node scripts/check-bundle.js
