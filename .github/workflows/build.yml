# Kept for branch protection / legacy "Build" checks on main.
# Parity with ci.yml: typecheck, lint, tests, translations, production build.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release checks and production build
        run: npm run release:check

      - name: Bundle policy check
        run: node scripts/check-bundle.js
